# SH STOCK — PC 없이 클라우드에서 매일 데이터 갱신 + 웹앱 배포 (GitHub Actions + GitHub Pages)
# 생성 데이터(data.js, detail/)는 저장소에 커밋하지 않고 바로 배포한다(저장소 비대화 방지).
# 저장소에는 추천 성과 추적용 일별 스냅샷(app/history/)만 쌓는다.
name: update-data

on:
  schedule:
    - cron: "10 7 * * 1-5"    # 16:10 KST 평일 — 국내장 마감 후
    - cron: "10 22 * * 1-5"   # 07:10 KST 화~토 — 미국장 마감 후
  workflow_dispatch: {}        # GitHub 화면에서 수동 실행
  push:
    branches: [main]
    paths: ["app/**", "tools/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false   # 진행 중 실행은 끝까지, 대기 중인 실행은 가장 최근 것만 남음

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 수집 (약 2,000종목 · 시세·재무·수급·뉴스·공시)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul
        run: python tools/fetch_data.py
      - name: 교차 검증
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Seoul
        run: python tools/verify_data.py
      - name: 일별 스냅샷 저장
        run: |
          git config user.name "sh-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/history
          git diff --cached --quiet || git commit -m "스냅샷 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 다른 실행이 먼저 스냅샷을 올렸으면 최신을 받아 합친 뒤 재시도 (같은 날 파일은 이번 실행 것을 우선)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4
