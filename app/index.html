<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A47">
<title>SH STOCK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SH STOCK">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <header class="hdr">
    <div class="hdr-top">
      <div class="logo">
        <div class="logo-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
        SH STOCK<small>AI 종목추천</small>
      </div>
      <div class="hdr-time" id="asof"></div>
    </div>
    <div class="ticker" id="ticker"></div>
  </header>

  <main>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-buy"></section>
    <section class="view" id="v-sell"></section>
    <section class="view" id="v-screen"></section>
    <section class="view" id="v-my"></section>
  </main>

  <div class="tray" id="tray"></div>
  <nav class="nav" id="nav">
    <button data-act="go" data-arg="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-act="go" data-arg="buy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 12.5l2-2 2 2 2.5-3"/></svg>매수분석</button>
    <button data-act="go" data-arg="sell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg>매도·교체</button>
    <button data-act="go" data-arg="screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>조건검색</button>
    <button data-act="go" data-arg="my"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>MY</button>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
  // 데이터 파일은 매일 자동 갱신되므로 브라우저 캐시를 우회해 항상 최신본을 읽는다
  (function load(files) {
    if (!files.length) return;
    var s = document.createElement("script");
    s.src = files[0] + "?t=" + Date.now();
    s.onload = s.onerror = function () { load(files.slice(1)); };
    document.body.appendChild(s);
  })(["data.js", "verify.js", "history/index.js", "engine.js", "app.js"]);
  // 스마트폰 홈 화면 설치·오프라인용 (http/https 로 열었을 때만)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
